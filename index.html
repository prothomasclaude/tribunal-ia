<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tribunal des IA</title>
<style>
  :root { color-scheme: dark; scrollbar-color: #6d5c85 #000; --bg: #17121f; --panel: #241c30; --line: #6d5c85; --ink: #eee; --dim: #a79bbd; --gold: #ffd84a; --pro: #ef6a62; --def: #6f9bf5; --wit: #5fcf9a; --jury: #c79bf2; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  main { max-width: 1240px; margin: auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  #affaire { flex: 1 1 260px; margin: 0; color: var(--gold); overflow-wrap: anywhere; }
  .tools { display: flex; gap: 14px; align-items: center; }
  .chk { display: flex; gap: 6px; align-items: center; font-size: 13px; }

  /* La salle à gauche, le procès-verbal à droite ; empilés sur petit écran */
  .court { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  #stage { position: relative; }
  canvas { width: 100%; display: block; image-rendering: pixelated; border: 4px solid var(--ink); box-sizing: border-box; }
  #obj { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(28px, 6vw, 72px); font-weight: 900;
         color: #ff3b3b; text-shadow: 4px 4px 0 #fff, 8px 8px 0 #000; animation: shake .1s infinite; }
  #obj[hidden] { display: none; }
  @keyframes shake { 50% { transform: translate(4px, -4px) rotate(-2deg); } }
  @media (prefers-reduced-motion: reduce) { #obj { animation: none; } }
  #hint { width: 100%; border-width: 0 4px; border-color: var(--ink); }
  #box { border: 4px solid var(--ink); border-top: 0; background: #000; padding: 10px 14px; height: 9em; overflow: auto; cursor: pointer; } /* hauteur fixe : le texte défile, le procès-verbal garde tout */
  #box p { margin: 4px 0 0; white-space: pre-wrap; }
  #who { color: var(--gold); }

  .pv { position: relative; border: 4px solid var(--ink); background: #000; min-height: 260px; }
  .pv > div { position: absolute; inset: 0; display: flex; flex-direction: column; } /* suit la hauteur de la salle au lieu de l'étirer */
  .pv h2 { margin: 0; padding: 8px 12px; border-bottom: 2px solid var(--line); }
  #log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 12px; }
  #log:empty::before { content: "Les prises de parole s'afficheront ici au fil de l'audience."; color: var(--dim); }
  #log, #hist ol { list-style: none; }
  #hist ol { padding: 0; margin: 10px 0; }
  #log li, #hist li { margin-bottom: 12px; padding-left: 10px; border-left: 4px solid var(--line); white-space: pre-wrap; }
  #log li strong, #hist li strong { display: block; }
  .l-pro { border-color: var(--pro) !important; } .l-pro strong { color: var(--pro); }
  .l-def { border-color: var(--def) !important; } .l-def strong { color: var(--def); }
  .l-wit { border-color: var(--wit) !important; } .l-wit strong { color: var(--wit); }
  .l-jury { border-color: var(--jury) !important; } .l-jury strong { color: var(--jury); }
  .l-judge { border-color: var(--gold) !important; } .l-judge strong { color: var(--gold); }

  .fiches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--dim); }
  .ghost { background: var(--panel); color: var(--ink); border-color: var(--line); font-weight: normal; font-size: 13px; padding: 4px 10px; }
  dialog { background: var(--bg); color: var(--ink); border: 4px solid var(--ink); padding: 18px 20px; width: min(640px, calc(100vw - 32px)); max-height: 85vh; }
  dialog::backdrop { background: #000a; }
  dialog h2 { font-size: 18px; color: var(--gold); }
  dialog ol, dialog ul { padding: 0; margin: 12px 0; list-style: none; }
  dialog li { margin-bottom: 12px; padding-left: 10px; border-left: 4px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog li strong { display: block; }
  dialog a { color: var(--def); }
  .stat { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  #decision { margin-top: 16px; border: 4px solid var(--gold); background: #000; padding: 12px 16px; }
  #steps { list-style: none; padding: 0; margin: 0 0 12px; }
  #steps label { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; font-size: 15px; cursor: pointer; }
  #steps input { margin-top: 4px; flex: none; }
  #steps input:checked + span { text-decoration: line-through; color: var(--dim); }
  #copied { margin-left: 10px; color: var(--dim); font-size: 13px; }
  .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 28px; }
  form { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  label { display: grid; gap: 2px; font-size: 12px; }
  input, textarea, button { font: inherit; padding: 6px; background: var(--panel); color: var(--ink); border: 2px solid var(--line); min-width: 0; }
  button { background: var(--gold); color: #000; border-color: #000; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  summary { cursor: pointer; padding: 4px 0; }
  details { border-bottom: 1px solid var(--panel); }
  details[open] { padding-bottom: 12px; }

  @media (max-width: 900px) {
    .court, .below { grid-template-columns: minmax(0, 1fr); }
    .pv { min-height: 0; } .pv > div { position: static; } #log { max-height: 50vh; }
  }
</style>
<main>
  <header>
    <h1>⚖ Tribunal des IA</h1>
    <p id="affaire">Aucune affaire en cours</p>
    <div class="tools">
      <label class="chk"><input id="snd" type="checkbox" checked> Son</label>
      <label class="chk"><input id="mus" type="checkbox" checked> Musique</label>
      <label class="chk" id="voix-l"><input id="voix" type="checkbox" checked> Voix</label>
      <button id="stop" type="button" hidden>Interrompre</button>
    </div>
  </header>

  <div class="court">
    <section aria-label="Salle d'audience">
      <div id="stage">
        <canvas id="scene" width="240" height="120" aria-hidden="true"></canvas>
        <div id="obj" hidden>OBJECTION !</div>
      </div>
      <button id="hint" type="button" hidden>🔇 Cliquez pour activer le son</button>
      <div id="box" title="Cliquer pour afficher tout le texte">
        <strong id="who">Greffier</strong>
        <p id="line">La cour attend votre demande.</p>
      </div>
      <div class="fiches" role="group" aria-label="Fiches du procès">
        Fiches :
        <button type="button" class="ghost" data-fiche="pro">Accusation</button>
        <button type="button" class="ghost" data-fiche="judge">Juge</button>
        <button type="button" class="ghost" data-fiche="def">Défense</button>
        <button type="button" class="ghost" data-fiche="wit">Témoin</button>
        <button type="button" class="ghost" data-fiche="jury">Jury</button>
        <button type="button" class="ghost" data-fiche="dossier">Dossier et pièces</button>
      </div>
    </section>
    <aside class="pv" aria-label="Procès-verbal"><div>
      <h2>Procès-verbal</h2>
      <ol id="log" aria-live="polite"></ol>
    </div></aside>
  </div>

  <section id="decision" hidden aria-labelledby="dec-h">
    <h2 id="dec-h">Décision de la cour</h2>
    <ol id="steps"></ol>
    <button id="copy" type="button">Copier la décision</button><span id="copied" role="status"></span>
  </section>

  <dialog id="fiche" aria-labelledby="fiche-h">
    <div id="fiche-body"></div>
    <form method="dialog"><button>Fermer</button></form>
  </dialog>

  <div class="below">
    <section>
      <h2>Ouvrir un procès ici</h2>
      <form id="f">
        <label>Votre demande
          <textarea id="case" rows="3" required placeholder="J'aimerais faire une application qui..."></textarea>
        </label>
        <div class="row">
          <label>Accusation (modèle) <input id="m-pro" list="models"></label>
          <label>Juge (modèle) <input id="m-judge" list="models"></label>
          <label>Défense (modèle) <input id="m-def" list="models"></label>
        </div>
        <div class="row">
          <label style="grid-column: span 2">Clé OpenRouter (vide = mode démo)
            <input id="key" type="password" autocomplete="off" placeholder="sk-or-...">
          </label>
          <label>Manches <input id="rounds" type="number" min="1" max="5" value="2"></label>
        </div>
        <button id="go">Ouvrir l'audience</button>
      </form>
      <datalist id="models"></datalist>
    </section>
    <section>
      <h2>Historique des procès</h2>
      <div id="hist"></div>
      <button id="clear" type="button" style="margin-top:12px">Vider l'historique</button>
    </section>
  </div>
</main>
<script src="proces.js"></script><!-- facultatif : procès préparé par /objection -->
<script>
const $ = id => document.getElementById(id)
const COMMON = "Tu joues dans un tribunal comique où des IA débattent de la meilleure façon de réaliser la demande d'un utilisateur. Réponds en français, sans markdown, ton théâtral de prétoire mais arguments techniques réels et concrets. "
const ROLES = {
  def: { bio: "Avocat de la Défense. Propose une solution ou défend la pièce jugée, et tient sa position.", name: 'Défense', prefix: 'google/', pitch: 330, sys: "Tu es l'avocat de la Défense. À ta première intervention, propose UNE solution concrète (stack, architecture, périmètre), puis défends-la bec et ongles contre l'Accusation. 90 mots maximum." },
  pro: { bio: "Procureur. Cherche les failles et plaide pour une alternative précise.", name: 'Accusation', prefix: 'openai/', pitch: 200, sys: "Tu es le Procureur. Attaque les failles de la solution de la Défense (coût, complexité, risques) et plaide pour une alternative concrète que tu juges meilleure. 90 mots maximum." },
  judge: { bio: "Juge. Écoute les débats, puis rend le verdict et la décision à appliquer.", name: 'Juge', prefix: 'anthropic/', pitch: 140, sys: "Tu es le Juge. Rends le verdict : désigne le gagnant (Défense ou Accusation), justifie en deux phrases, en tenant compte du témoin et du vote du jury, qui reste consultatif, puis écris « Décision : » suivi des étapes concrètes retenues, numérotées en chiffres (1., 2., 3.), une par ligne. 150 mots maximum." },
  // field : le témoin n'a pas de champ modèle à lui, il emprunte celui du Juge
  wit: { bio: "Témoin expert. Appelé à la barre après la première manche pour établir les faits, sans prendre parti.", name: 'Témoin', field: 'judge', pitch: 260, sys: "Tu es un témoin expert neutre, appelé à la barre entre deux manches. Choisis la spécialité la plus utile à l'affaire (sécurité, coût, expérience utilisateur, performance, maintenance) et annonce-la en commençant. Éclaire le point le plus disputé par des faits vérifiables et dis ce qui est exact ou faux dans ce que chaque partie a affirmé. Tu ne désignes pas de gagnant. 70 mots maximum." },
  jury: { bio: "Jury. Cinq jurés aux regards différents votent à main levée avant le verdict. Leur vote est consultatif : le Juge peut s'en écarter.", name: 'Jury', field: 'judge', pitch: 300, sys: "Tu es le jury : cinq jurés aux regards différents (le pragmatique, la sceptique, le comptable, l'utilisatrice, le mainteneur). Chacun vote pour la Défense ou pour l'Accusation d'après les débats. Écris exactement cinq lignes, une par juré, sous la forme « Le pragmatique vote Défense : sa raison en dix mots au plus. », puis une sixième ligne « Résultat : N voix pour la Défense, M pour l'Accusation. » Rien d'autre." },
}
const FIELDS = ['pro', 'judge', 'def'] // les rôles qui ont un champ modèle dans le formulaire
const roleOf = who => Object.keys(ROLES).find(r => who.startsWith(ROLES[r].name))
const DEMO = {
  def: ["Votre Honneur, ma cliente est une simple page HTML. Pas de build, pas de serveur, pas de larmes. Elle fait le travail et rentre dîner à l'heure.",
        "Calomnie ! Un framework pour trois boutons, c'est louer un stade pour jouer aux billes. Ma cliente tient en un fichier et le jury peut la lire en entier."],
  pro: ["Une page HTML ! Et demain, quand il faudra un état partagé, des tests, une équipe ? Je réclame un vrai framework, avec composants et typage.",
        "La Défense confond simplicité et négligence. Sans structure, chaque ajout sera un crime de plus au dossier. Je maintiens mes réquisitions."],
  wit: ["Expert en maintenance, je jure de dire la vérité. Fait numéro un : trois boutons ne justifient aucun framework. Fait numéro deux : sans tests, même un seul fichier finit par mordre. Chaque partie a donc à moitié raison, ce qui est très agaçant pour tout le monde."],
  jury: ["Le pragmatique vote Défense : un fichier suffit pour trois boutons.\nLa sceptique vote Accusation : sans tests, je n'y crois pas.\nLe comptable vote Défense : zéro dépendance, zéro facture.\nL'utilisatrice vote Défense : je veux juste que ça marche.\nLe mainteneur vote Accusation : c'est moi qui relirai ce fichier.\nRésultat : 3 voix pour la Défense, 2 pour l'Accusation."],
  judge: ["Silence ! La cour donne raison à la Défense : le besoin est petit, la solution doit l'être aussi.\n\nDécision :\n1. Un seul fichier HTML, sans build.\n2. On mesure l'usage réel.\n3. On ne passe au framework que si la douleur est prouvée.\n\nL'audience est levée. (Mode démo : ajoutez une clé OpenRouter pour un vrai procès.)"],
}

// --- Scène pixel (240x120, agrandie en CSS) ---
const c = $('scene').getContext('2d')
const st = { speaker: null, thinking: false, gavel: -1e9, stir: -1e9 }
const P = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h) }
// Sprites 16x20 : une lettre = un pixel, '.' = transparent. Couleurs communes dans PAL, propres au personnage dans pal.
const PAL = { k: '#1a1420', s: '#f1c9a5', d: '#d9a07c', w: '#f4f4f4', g: '#c2c2d1', e: '#222222', m: '#7a2b2b' }
const SUIT = [
  '.....kssssk.....',
  '..kkrrwttwrrkk..',
  '.krrrrwttwrrrrk.',
  'krrrrrRttRrrrrrk',
  'krrrrrrttrrrrrrk',
  'krRrrrrttrrrrRrk',
  'krRrrrrrrrrrrRrk',
  'krRrrrrrrrrrrRrk',
]
const SPRITES = {
  judge: { pal: { r: '#2b2636', R: '#15121a' }, rows: [
    '....kkkkkkkk....',
    '..kkwwwwwwwwkk..',
    '.kwwgwwwwwwgwwk.',
    '.kwwwwwwwwwwwwk.',
    '.kwgwsssssswgwk.',
    '.kwwsssssssswwk.',
    '.kgwskksskkswgk.',
    '.kwwsesssseswwk.',
    '.kwgssssssssgwk.',
    '.kwwsssddssswwk.',
    '.kgwsssmmssswgk.',
    '.kwwkddssddkwwk.',
    '.kgwk.kssk.kwgk.',
    '..kkkrwwwwrkkk..',
    '.krrrrwwwwrrrrk.',
    'krrrrrRwwRrrrrrk',
    'krrrrrrwwrrrrrrk',
    'krRrrrrrrrrrrRrk',
    'krRrrrrrrrrrrRrk',
    'krRrrrrrrrrrrRrk',
  ] },
  pro: { arm: 1, pal: { h: '#2a1a10', H: '#5a3a26', r: '#a32a2a', R: '#7d1f1f', t: '#1b1b1b' }, rows: [
    '....kkkkkkkk....',
    '...khhhhhhhhk...',
    '..khhHHHhhhhhk..',
    '..khhhhhhhhhhk..',
    '..khsssssssshk..',
    '..kssssssssssk..',
    '..kskkssskkssk..',
    '..kswessswessk..',
    '..kssssssssssk..',
    '..ksssssdssssk..',
    '..kssssmmssssk..',
    '...kddssssddk...',
    ...SUIT,
  ] },
  def: { arm: -1, flip: true, pal: { h: '#d9a441', H: '#f7dc86', r: '#2a4fa3', R: '#1f3b7d', t: '#c0392b' }, rows: [
    '...kk.kkk.kk....',
    '..khhkhhhkhhk...',
    '..khHHhhHhhhhk..',
    '..khhhhhhhhhhk..',
    '..khhsssssshhk..',
    '..khsssssssshk..',
    '..ksddsssddssk..',
    '..kswessswessk..',
    '..kssssssssssk..',
    '..ksssssdssssk..',
    '..ksssmmmmsssk..',
    '...kddssssddk...',
    ...SUIT,
  ] },
}
SPRITES.wit = { noBlink: true, pal: { h: '#c8643c', H: '#e89a6a', r: '#2f7d5b', R: '#1f5a40', t: '#e8d27a' }, rows: [
  '....kkkkkkkk....',
  '...khhhhhhhhk...',
  '..khhhhHHHhhhk..',
  '..khhhhhhhhhhk..',
  '..khhsssssshhk..',
  '..kssssssssssk..',
  '..kssssssssssk..',
  '..kkwekskweksk..', // lunettes : le clignement les effacerait, d'où noBlink
  '..kssssssssssk..',
  '..ksssssdssssk..',
  '..kssssmmssssk..',
  '...kddssssddk...',
  ...SUIT,
] }
for (const r in SPRITES) console.assert(SPRITES[r].rows.length === 20 && SPRITES[r].rows.every(l => l.length === 16), 'sprite mal formé : ' + r)

// (x, y) = centre du cou ; la tête occupe les 12 lignes au-dessus
function person(role, x, y, t) {
  const sp = SPRITES[role], active = st.speaker === role, talking = active && !st.thinking
  if (talking) y += Math.round(Math.sin(t / 120))
  sp.rows.forEach((row, j) => {
    for (let i = 0; i < 16; i++) {
      const ch = row[sp.flip ? 15 - i : i]
      if (ch !== '.') P(x - 8 + i, y - 12 + j, 1, 1, sp.pal[ch] || PAL[ch])
    }
  })
  if (!sp.noBlink && ((t / 150 | 0) + x) % 20 === 0) P(x - 4, y - 5, 8, 1, PAL.d) // clignement
  if (talking && (t / 150 | 0) % 2) P(x - 1, y - 2, 2, 2, '#4a1515')
  if (talking && sp.arm) { P(x + sp.arm * 8, y + 3, sp.arm * 5, 3, sp.pal.r); P(x + sp.arm * 13, y + 3, sp.arm * 3, 2, PAL.s) } // bras accusateur
  if (talking) P(x - 1, y - 16, 3, 2, '#ffd84a')
  if (active && st.thinking) for (let k = 0; k < (t / 300 | 0) % 4; k++) P(x - 4 + k * 3, y - 16, 2, 2, '#fff')
}
// Public vu de dos au premier plan ; il s'agite aux objections et au verdict
const HAIR = ['#2a1a10', '#d9a441', '#8b3a1e', '#c2c2d1', '#1b1b1b', '#5a3a26']
const COAT = ['#4a5a7a', '#6b3b5a', '#3f6b4a', '#7a6a3a']
function crowd(t) {
  const stir = t - st.stir < 1200
  for (let i = 0; i < 13; i++) {
    const x = 6 + i * 18 + (i % 2) * 3
    const y = 108 + i * 7 % 3 + (stir ? Math.round(Math.sin(t / 60 + i * 2)) * 2 : Math.sin(t / 900 + i * 5) > .9 ? -1 : 0)
    P(x - 1, y - 1, 10, 9, PAL.k); P(x, y, 8, 7, HAIR[i % 6]); P(x + 1, y + 1, 3, 1, '#ffffff33')
    P(x - 4, y + 7, 16, 12, PAL.k); P(x - 3, y + 8, 14, 12, COAT[i % 4])
  }
}
// Le banc du jury, à droite du Juge. Chaque juré lève la main quand la ligne de son vote s'écrit dans la boîte de dialogue,
// avec un carton de la couleur du camp choisi (bleu Défense, rouge Accusation).
const JURY_X = [176, 189, 202, 215, 228]
// une ligne par juré : un juré qui s'abstient garde la main baissée sans décaler les suivants
const votesIn = text => text.split('\n').filter(l => l.trim()).map(l => { const m = l.match(/vote (?:pour )?(?:la |l')?(Défense|Accusation)/i); return m && (/^d/i.test(m[1]) ? 'def' : 'pro') })
function jury(t) {
  const votes = st.speaker === 'jury' ? votesIn($('line').textContent) : []
  JURY_X.forEach((x, k) => {
    P(x - 3, 33, 7, 8, PAL.k); P(x - 2, 34, 5, 6, PAL.s); P(x - 2, 34, 5, 2, HAIR[(k * 2 + 1) % 6])
    P(x - 1, 37, 1, 1, PAL.e); P(x + 1, 37, 1, 1, PAL.e)
    P(x - 4, 41, 9, 3, COAT[k % 4])
    if (votes[k]) { P(x + 4, 29, 2, 8, PAL.s); P(x + 2, 25, 6, 4, PAL.k); P(x + 3, 26, 4, 2, votes[k] === 'def' ? '#6f9bf5' : '#ef6a62') }
  })
  P(168, 44, 70, 9, '#8a5a32'); P(166, 43, 74, 2, '#a9713f')
  if (st.speaker === 'jury' && st.thinking && !votes.some(Boolean)) for (let k = 0; k < (t / 300 | 0) % 4; k++) P(198 + k * 3, 27, 2, 2, '#fff')
}
function draw(t) {
  P(0, 0, 240, 120, '#3b2a4a')
  for (let x = 0; x < 240; x += 24) P(x, 0, 1, 80, '#2e2039')
  P(0, 80, 240, 40, '#6b4a35')
  person('judge', 120, 31, t)
  P(84, 40, 72, 42, '#8a5a32'); P(84, 40, 4, 42, '#754a28'); P(152, 40, 4, 42, '#754a28') // pupitre du juge, jusqu'à l'estrade
  P(80, 38, 80, 4, '#a9713f')
  P(112, 48, 6, 2, '#e0b93a'); P(112, 50, 16, 11, '#ffd84a'); P(114, 53, 12, 1, '#b8902a'); P(114, 56, 9, 1, '#b8902a') // le dossier de l'affaire, cliquable
  P(70, 82, 100, 6, '#7d5540'); P(70, 82, 100, 1, '#a9713f') // estrade posée sur le plancher
  const down = t - st.gavel < 900 && (t / 150 | 0) % 2 // le marteau frappe au verdict
  P(138, down ? 34 : 26, 9, 4, '#5a3a1e'); P(141, down ? 30 : 30, 2, 8, '#c9a26b')
  jury(t)
  person('pro', 50, 76, t)
  P(30, 86, 40, 20, '#8a5a32'); P(28, 84, 44, 3, '#a9713f')
  person('def', 190, 76, t)
  P(170, 86, 40, 20, '#8a5a32'); P(168, 84, 44, 3, '#a9713f')

function beep(f, dur, type = 'square', vol = .05, at = 0) {
  if (mute()) return
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at
  o.type = type; o.frequency.value = f
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur)
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur)
}
function noise(dur, vol, freq, at = 0) { // souffle filtré : grave = coup de marteau, médium = brouhaha du public
  if (mute()) return
  const buf = ac.createBuffer(1, ac.sampleRate * dur | 0, ac.sampleRate), d = buf.getChannelData(0)
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length)
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain()
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol
  src.connect(f).connect(g).connect(ac.destination); src.start(ac.currentTime + at)
}

// Lit un flux SSE de chat completions, appelle onDelta à chaque morceau de texte, renvoie le texte complet
async function readSSE(r, onDelta) {
  const reader = r.body.pipeThrough(new TextDecoderStream()).getReader()
  let buf = '', text = ''
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    const parts = (buf + value).split('\n')
    buf = parts.pop() // ligne incomplète, finie au prochain morceau
    for (const l of parts) {
      if (!l.startsWith('data: ') || l.startsWith('data: [DONE]')) continue // ignore aussi les commentaires keep-alive
      const j = JSON.parse(l.slice(6))
      if (j.error) throw new Error(j.error.message)
      let d = j.choices?.[0]?.delta?.content
      if (d && !text) d = d.trimStart()
      if (d) { text += d; onDelta(d) }
    }
  }
  return text
}

// canned = texte déjà connu (démo ou rediffusion) : il suit le même chemin que le vrai flux, mot par mot
async function ask(role, transcript, onDelta, canned) {
  ctl.signal.throwIfAborted()
  if (canned) {
    await wait(900)
    for (const w of canned.match(/\S+\s*/g) || []) { ctl.signal.throwIfAborted(); onDelta(w); await wait(40) }
    return canned
  }
  const key = $('key').value.trim()
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', signal: ctl.signal,
    headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: $('m-' + (ROLES[role].field || role)).value, max_tokens: 1500, stream: true,
      messages: [
        { role: 'system', content: COMMON + ROLES[role].sys },
        { role: 'user', content: `Demande de l'utilisateur : ${$('case').value}\n\nDébats jusqu'ici :\n${transcript || "(aucun, tu ouvres l'audience)"}\n\nÀ toi, ${ROLES[role].name}.` },
      ],
    }),
  })
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error?.message || 'HTTP ' + r.status)
  const text = (await readSSE(r, onDelta)).trim()
  if (!text) throw new Error('réponse vide')
  return text
}

let frVoices = []
function loadVoices() {
  frVoices = synth ? synth.getVoices().filter(v => v.lang.toLowerCase().startsWith('fr')) : []
  $('voix').disabled = !frVoices.length // sans voix française, la lecture serait faite avec un accent étranger : on préfère se taire

  const u = new SpeechSynthesisUtterance(text)
  u.lang = 'fr-FR'

// msg = { text, done } rempli au fil du flux (ou une simple chaîne) ; la machine à écrire suit ce qui est arrivé.
// role fourni = réplique d'un personnage, lue à voix haute si la voix est active (sinon un blip par lettre).
function show(who, msg, pitch = 260, role) {
  if (typeof msg === 'string') msg = { text: msg, done: true }
  $('who').textContent = who
  skip = false
  const voiced = role && voiceOn()
  return new Promise(res => {
    let i = 0, spoken = 0, typedAt
    const id = setInterval(() => {
      const before = Math.floor(i), len = msg.text.length
      i = skip ? len : Math.min(i + (voiced ? .3 : 1), len) // avec la voix, le texte s'écrit à peu près à la vitesse de la parole
      $('line').textContent = msg.text.slice(0, Math.floor(i))
      $('box').scrollTop = $('box').scrollHeight
      if (voiced && !skip) { // chaque phrase est dite dès qu'elle est complète, sans attendre la fin du flux
        const rest = msg.text.slice(spoken)
        const chunk = msg.done ? rest : rest.match(/^[\s\S]*[.!?…]["»]?\s/)?.[0]
        if (chunk) { spoken += chunk.length; if (chunk.trim()) say(role, chunk.trim()) }
      } else if (!skip && Math.floor(i) > before && Math.floor(i) % 3 === 0 && msg.text[Math.floor(i)] !== ' ') beep(pitch, .03, 'square', .03)
      if (!msg.done || i < len) return
      typedAt ??= Date.now()
      // on attend la fin de la lecture, mais jamais plus de 30 s : une voix muette ne doit pas bloquer l'audience
      if (voiced && !skip && (synth.speaking || synth.pending) && Date.now() - typedAt < 30000) return
      clearInterval(id); res()
    }, 18)
  })
}

const checks = () => { try { return JSON.parse(localStorage.checks) || {} } catch { return {} } }
const stepsOf = text => (text || '').match(/^\s*\d+[.)]\s+.+$/gm)?.map(l => l.replace(/^\s*\d+[.)]\s+/, '')) || []

// Recharge proces.js (une balise script fonctionne aussi en file://, contrairement à fetch)
function reload() {

const clean = tr => ({ ...tr, next: undefined }) // next = orateur attendu, n'a de sens que pendant l'audience en direct

// replay = un procès à diffuser tel quel (historique, ou audience en direct de /objection tant que replay.next est posé).
// Aucun appel aux modèles dans ce cas.
async function trial(replay) {
  if ($('go').disabled) return
  busy(true)
  ac ||= new AudioContext(); ac.resume() // ne démarre vraiment qu'après un clic, exigence des navigateurs
  setTimeout(() => $('hint').hidden = ac.state === 'running', 300)
  music(true)
  ctl = new AbortController()
  $('log').replaceChildren()
  const lines = [], order = [], saved = [], q = replay ? replay.q : $('case').value
  const t = replay ? replay.t : Date.now()
  renderDecision(t)
  current = { q, log: saved, pieces: replay?.pieces || [] }
  const live = $('key').value.trim()
  let done = false
  $('affaire').textContent = `${replay ? replay.next ? 'En direct' : 'Rediffusion' : 'Audience'} : ${q}`
  if (replay) $('stage').scrollIntoView({ behavior: 'smooth', block: 'start' })
  else {
    for (let i = 0; i < +$('rounds').value; i++) order.push('def', 'pro')
    order.splice(2, 0, 'wit') // le témoin expert passe à la barre après la première manche
    order.push('jury', 'judge') // le jury vote à main levée juste avant le verdict
  }
  try {
    for (let i = 0; ; i++) {
      let role, who, canned, stats = {}, t0
      if (replay) {
        while (replay.next && !replay.log[i]) { // direct : la réplique suivante n'est pas encore écrite, l'orateur réfléchit
          st.speaker = roleOf(replay.next); st.thinking = true
          $('who').textContent = replay.next; $('line').textContent = '… prépare sa prise de parole'
          await wait(1500)
          ctl.signal.throwIfAborted()
          await reload()
          if (window.TRIAL?.t === replay.t) replay = TRIAL
        }
        const l = replay.log[i]
        if (!l) break
        role = roleOf(l.who); who = l.who; canned = l.text; stats = { ms: l.ms, tools: l.tools }
        if (!role) continue
      } else {
        if (i >= order.length) break
        role = order[i]
        who = `${role === 'wit' ? 'Témoin expert' : ROLES[role].name} (${live ? $('m-' + (ROLES[role].field || role)).value : 'démo'})`
        canned = live ? null : DEMO[role][saved.filter(l => roleOf(l.who) === role).length % DEMO[role].length]
      }
      st.speaker = role; st.thinking = true
      $('who').textContent = who; $('line').textContent = '…'
      const msg = { text: '', done: false }
      let first
      const started = new Promise(r => first = r)
      t0 = performance.now()
      const whole = ask(role, lines.join('\n\n'), d => { msg.text += d; first() }, canned).finally(() => { msg.done = true; first() })
      whole.catch(() => {}) // l'erreur est relevée par le await plus bas
      await started // premier mot reçu, ou échec
      if (!msg.text) await whole
      if (role === 'judge') sfxGavel()
      else if (lines.length) {
        $('obj').textContent = { wit: 'TÉMOIN À LA BARRE !', jury: 'LE JURY VOTE !' }[role] || 'OBJECTION !'
        role === 'wit' || role === 'jury' ? sfxWitness() : sfxObjection()
        $('obj').hidden = false; await wait(900); $('obj').hidden = true
      }
      st.thinking = false
      await show(who, msg, ROLES[role].pitch, role)
      const text = await whole
      if (!canned) stats = { ms: Math.round(performance.now() - t0) } // vrai appel à un modèle : on chronomètre
      lines.push(`${ROLES[role].name} : ${text}`)
      saved.push({ who, text, ...stats })
      logLine($('log'), who, text)
      $('log').scrollTop = $('log').scrollHeight
      if (role === 'judge') renderDecision(t, q, text)
      st.thinking = true // bouche fermée pendant qu'on lit
      await wait(1500)
    }
    done = true
  } catch (err) {
    st.speaker = null
    await show('Greffier', ctl.signal.aborted ? 'Audience interrompue à votre demande.' : 'Audience suspendue : ' + err.message)
  }
  st.speaker = null; st.thinking = false
  music(false)
  if (replay) localStorage.trials = JSON.stringify(trials().map(x => x.t === replay.t ? clean(replay) : x)) // un direct s'est allongé depuis son archivage
  else if (saved.length) localStorage.trials = JSON.stringify([{ t, q, done, log: saved }, ...trials()].slice(0, 30)) // rien à archiver avant la première réplique
  renderHistory()
  if (replay) dismissed = replay.t
  $('hint').hidden = true
  busy(false)
}

$('f').onsubmit = e => { e.preventDefault(); trial() }

// Procès préparé par la commande /objection de Claude Code : proces.js pose window.TRIAL à côté de cette page.
// La salle le lance toute seule, sans rien redemander. Tant que TRIAL.next est posé, l'audience est en cours côté
// Claude Code et la salle la suit en direct. Un procès déjà vu (archivé, ou quitté dans cette page) n'est pas relancé.
let dismissed, faitSeen // faitSeen : dernière liste d'étapes appliquées déjà reportée, pour ne pas recocher ce que l'utilisateur décoche
function checkDocket() {
  const T = window.TRIAL
  if (!T || !Array.isArray(T.log)) return
  if (T.fait?.length && faitSeen !== T.t + ':' + T.fait) { // étapes que Claude Code a appliquées après le verdict
    faitSeen = T.t + ':' + T.fait
    const c = checks()
    c[T.t] = [...new Set([...(c[T.t] || []), ...T.fait])]
    localStorage.checks = JSON.stringify(c)
    if (shown?.t === T.t) renderDecision(shown.t, shown.q, shown.text)
  }
  if ($('go').disabled || T.t === dismissed) return
  const known = trials().some(x => x.t === T.t)
  if (known && !T.next) return
  if (!known) { localStorage.trials = JSON.stringify([clean(T), ...trials()].slice(0, 30)); renderHistory() }
  $('case').value = T.q
  trial(T)
}
checkDocket()
setInterval(() => { if (!$('go').disabled) reload().then(checkDocket) }, 3000) // page restée ouverte : repère le prochain /objection
</script>
